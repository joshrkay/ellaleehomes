<!-- REVIEWS (injected by scripts/build-html.mjs at REVIEWS_PARTIAL; the homepage section, the same on Home, Why Us, Developers and Our Story).
     The cards come from data/reviews.json. Styles: assets/site-reviews.css. Strip and arrows: assets/site-reviews.js. -->
  <section id="testimonials" data-elh-testi="1" data-screen-label="Testimonials" style="padding: clamp(48px, 6vw, 96px) clamp(20px, 4vw, 64px) clamp(80px, 11vw, 160px); background: linear-gradient(#001526 0px, #000D19 260px); color: #EAE5DC">
    <div style="display: flex; flex-direction: column; gap: clamp(44px, 5vw, 68px); max-width: 1500px; margin: 0 auto">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 28px">
        <div style="display: flex; flex-direction: column; gap: 16px">
          <span style="font-size: 11px; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; color: #BFA06A">Reviews</span>
          <h2 style="margin: 0; font-family: var(--disp, 'DM Serif Display', Georgia, serif); font-size: clamp(30px, 4.1vw, 60px); font-weight: 400; line-height: 1.08">What our homeowners say.</h2>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px">
          <a href="https://www.google.com/maps/place/Ella+Lee+Homes/@33.5004403,-112.0567192,15z/data=!4m2!3m1!1s0x0:0x944a316da291c221" target="_blank" rel="noopener" style="font-size: 12px; letter-spacing: .08em; color: rgba(234,229,220,.72)">Read our reviews on Google</a>
          <!-- Arrows for the reviews strip: hidden until assets/site-reviews.js finds the strip overflows. -->
          <div data-elh-reviews-nav="1" hidden>
            <button class="elh-rv-arrow" type="button" aria-label="Previous reviews" aria-controls="reviews-scroller" data-elh-reviews-go="-1" style="flex: 0 0 auto; display: flex; align-items: center; justify-content: center; width: clamp(44px, 4vw, 58px); height: clamp(44px, 4vw, 58px); color: #EAE5DC; background: rgba(0,21,38,.55); border: 1px solid rgba(234,229,220,.5); border-radius: 50%; cursor: pointer; transition: background .3s ease, border-color .3s ease">
              <span style="display: block; width: 9px; height: 9px; border-left: 1px solid currentColor; border-bottom: 1px solid currentColor; transform: rotate(45deg) translate(1px, -1px)"></span>
            </button>
            <button class="elh-rv-arrow" type="button" aria-label="Next reviews" aria-controls="reviews-scroller" data-elh-reviews-go="1" style="flex: 0 0 auto; display: flex; align-items: center; justify-content: center; width: clamp(44px, 4vw, 58px); height: clamp(44px, 4vw, 58px); color: #EAE5DC; background: rgba(0,21,38,.55); border: 1px solid rgba(234,229,220,.5); border-radius: 50%; cursor: pointer; transition: background .3s ease, border-color .3s ease">
              <span style="display: block; width: 9px; height: 9px; border-right: 1px solid currentColor; border-top: 1px solid currentColor; transform: rotate(45deg) translate(-1px, 1px)"></span>
            </button>
          </div>
        </div>
      </div>
      <div id="reviews-scroller" role="region" aria-label="Client reviews" tabindex="0" style="display: flex; gap: clamp(18px, 2.2vw, 32px); overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; scroll-padding-left: clamp(20px, 4vw, 64px); scroll-padding-right: clamp(20px, 4vw, 64px); scrollbar-width: none; padding-top: 6px; padding-bottom: 10px; margin: -6px calc(-1 * clamp(20px, 4vw, 64px)) -6px; padding-left: clamp(20px, 4vw, 64px); padding-right: clamp(20px, 4vw, 64px)">
        <!-- @reviews:home -->
        <!-- /@reviews:home -->
      </div>
    </div>
  </section>
